# Lake build for lean-modules/, from this repository alone.
#
# The proved modules under ActiveGeometry/ are the files INTEGRATION.md and its 14 October addendum
# say to add to the kernel's `theory/lean/ActiveGeometry/`. Since kernel commit 72d2c4d6 (task T2) they
# are there, as the modules `ActiveGeometry.<M>`, and that is what builds here: `lake build` builds the
# kernel's `ActiveGeometry` library at the pinned commit, the eight included, and
# axcheck/AxiomCheck.lean checks their axioms by importing them from it. The copies in this
# directory are the specification's record; ci.sh checks that each is byte-identical to the kernel's.
#
# Before T2 the copies were built here under top-level names (srcDir = ActiveGeometry), because the
# kernel's library claims every `ActiveGeometry.*` name; that workaround is gone.
#
# Both dependencies are pinned by commit. The kernel's own lake-manifest.json pins the same
# Mathlib revision; it is repeated here so that the pin is visible without reading the manifest.

name = "theory_modules"
defaultTargets = ["TheoryModules"]

[leanOptions]
# As in the kernel's lakefile.lean. (The kernel also sets the pretty-printer option pp.unicode.fun,
# which does not affect elaboration.)
autoImplicit = false

# The kernel, at the commit of the pull request that integrated the eight modules (task T2).
# No tag exists yet (decision D10); pinned to a commit on purpose.
[[require]]
name = "ActiveGeometry"
git = "https://github.com/sentry-bio/addressability-limit"
rev = "72d2c4d6e9f70f9ffaafdd590301d5b50311c5cf"
subDir = "theory/lean"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "51c80a99cdb5e352e0871dae67039335d16e49c6"

# The default target: one file importing the kernel's eight modules, so that `lake build` compiles them.
[[lean_lib]]
name = "TheoryModules"
roots = ["TheoryModules"]

# The challenge files: the same statements as the kernel's ActiveGeometry/<M>.lean with every proof
# replaced by `sorry`, built here against the kernel. Not a default target, so `lake build` stays
# sorry-free; `lake build Challenges` builds them.
[[lean_lib]]
name = "Challenges"
roots = [
  "Challenges.AuditFactors",
  "Challenges.BalloonCapacity",
  "Challenges.BalloonPacking",
  "Challenges.CoarseConverse",
  "Challenges.Heredity",
  "Challenges.Persistent",
  "Challenges.Rigidity",
  "Challenges.Window",
]
